# Build the Web export and publish it to GitHub Pages and itch.io
# whenever a tag is pushed. Tag pattern is anything starting with `v`
# (e.g. `v0.3.0`, `v1.0-jam`), so day-to-day commits don't redeploy.
#
# One-time setup:
#   - Settings → Pages → "Build and deployment" source = "GitHub Actions".
#   - Settings → Secrets and variables → Actions → new secret
#     `BUTLER_API_KEY` with a token from
#     https://itch.io/user/settings/api-keys.
name: Deploy Web build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two deploys stepping on each other if tags are pushed quickly.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.6.3
  EXPORT_PRESET: Web
  OUTPUT_DIR: build/web
  ITCH_TARGET: bjorvack/last-call-a-story-in-ten-calls
  ITCH_CHANNEL: html5

jobs:
  build:
    name: Export Web build
    runs-on: ubuntu-latest
    container:
      # barichello/godot-ci ships the Godot editor + matching export
      # templates pre-installed, so we don't have to download them by
      # hand in the workflow.
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Move export templates into place
        # The image stores templates under /root/.local/share/godot/...
        # but the actions/checkout runner clears HOME differences; symlink
        # them into the runner's home so the Godot CLI finds them.
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
                  ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Export Web preset
        run: |
          mkdir -p "${OUTPUT_DIR}"
          godot --headless --export-release "${EXPORT_PRESET}" "${OUTPUT_DIR}/index.html"
          ls -lh "${OUTPUT_DIR}"

      - name: Inject Cross-Origin-Isolation headers via _headers
        # GitHub Pages serves static files; we can't set HTTP response
        # headers globally, but Godot 4 web builds need
        # SharedArrayBuffer which requires COOP/COEP. Since we can't set
        # those on Pages, fall back to the gd-html5-cross-origin
        # service-worker shim Godot generates when
        # `ensure_cross_origin_isolation_headers=false` is set in the
        # preset — that's the default for our Web preset.
        run: |
          touch "${OUTPUT_DIR}/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.OUTPUT_DIR }}

      - name: Upload raw build for the itch job
        uses: actions/upload-artifact@v6
        with:
          name: web-build
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error

  deploy_pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  deploy_itch:
    name: Push build to itch.io
    needs: build
    runs-on: ubuntu-latest
    # Skip silently if the secret isn't configured yet so the Pages job
    # can still publish from a freshly-forked repo.
    if: ${{ vars.SKIP_ITCH != 'true' }}
    steps:
      - name: Download Web build
        uses: actions/download-artifact@v6
        with:
          name: web-build
          path: web-build

      - name: Install Butler
        run: |
          curl -L -o butler.zip "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default"
          unzip -o butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning::BUTLER_API_KEY secret is not set — skipping itch.io push."
            exit 0
          fi
          # Tag name (e.g. v0.1.0) becomes the channel's user-version on itch.
          VERSION="${GITHUB_REF_NAME:-manual}"
          echo "Pushing channel ${ITCH_CHANNEL} of ${ITCH_TARGET} as ${VERSION}"
          ./butler push --userversion "$VERSION" \
            web-build "${ITCH_TARGET}:${ITCH_CHANNEL}"
